<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Audio Capture Spike</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: -apple-system, system-ui, sans-serif;
        margin: 0; padding: 24px; line-height: 1.5;
      }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p.sub { margin: 0 0 20px; opacity: 0.7; font-size: 13px; }
      button {
        font-size: 15px; padding: 10px 18px; border-radius: 8px;
        border: 1px solid currentColor; background: transparent; cursor: pointer;
      }
      button:disabled { opacity: 0.4; cursor: default; }
      .meter { height: 14px; border-radius: 7px; background: #8884; margin: 16px 0 4px; overflow: hidden; }
      .meter > div { height: 100%; width: 0%; background: #3b82f6; transition: width 60ms linear; }
      .verdict { font-size: 16px; font-weight: 600; margin: 16px 0; min-height: 22px; }
      .go { color: #16a34a; } .nogo { color: #dc2626; } .pending { opacity: 0.7; }
      pre {
        background: #8881; border-radius: 8px; padding: 12px; font-size: 12px;
        white-space: pre-wrap; max-height: 260px; overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>System Audio Capture Spike</h1>
    <p class="sub">Play audio (a video, music — anything), then record 6 seconds of system audio.</p>

    <button id="start">Record 6s of system audio</button>

    <div class="meter"><div id="bar"></div></div>
    <div id="verdict" class="verdict pending">Idle.</div>

    <pre id="log"></pre>

    <script src="renderer.js"></script>
  </body>
</html>
